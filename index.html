<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question for You</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cute cat/bear GIF -->
        <img id="gif" src="https://giphy.com" alt="Cute GIF">
        
        <!-- Clean question without emojis -->
        <h1 id="question">Will you be my girlfriend?</h1>
        
        <!-- Buttons without emojis -->
        <div class="btn-group">
            <button class="yes-btn" onclick="selectYes()">Yes</button>
            <button class="no-btn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
